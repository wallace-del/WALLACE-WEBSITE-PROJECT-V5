name: Update production project facts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-project-facts:
    name: Update two production project records
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Verify database secret exists
        shell: bash
        run: |
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::PRODUCTION_DATABASE_URL is missing from GitHub Actions secrets."
            exit 1
          fi

      - name: Install backend dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: ./node_modules/.bin/prisma generate

      - name: Update production project facts
        run: node prisma/update-project-facts.js